name: ModernSecure
options:
  bundleIdPrefix: kz.modernsecure
  deploymentTarget:
    iOS: '16.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SITE_HOST: localhost:3000
    SITE_SCHEME: http
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SITE_HOST: REPLACE_WITH_YOUR_DOMAIN
      SITE_SCHEME: https
targets:
  ModernSecure:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Современная защита
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        SiteURL: $(SITE_SCHEME)://$(SITE_HOST)
        UILaunchScreen:
          UIColorName: AppCanvas
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FirebaseMessagingAutoInitEnabled: false
        NSCameraUsageDescription: Сфотографировать документ для отправки в своё дело.
        NSPhotoLibraryUsageDescription: Выбрать фотографию документа для своего дела.
    entitlements:
      path: ModernSecure.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.modernsecure.app
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
