name: ModernSecure
options:
  developmentLanguage: ru
  bundleIdPrefix: kz.modernsecure
  deploymentTarget:
    iOS: '16.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
settings:
  base:
    DEVELOPMENT_LANGUAGE: ru
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SITE_HOST: localhost:3000
    SITE_SCHEME: http
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SITE_HOST: modernsecure.shpshka.work
      SITE_SCHEME: https
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
targets:
  ModernSecure:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Современная защита
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        SiteURL: $(SITE_SCHEME)://$(SITE_HOST)
        UILaunchScreen:
          UIColorName: AppCanvas
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FirebaseMessagingAutoInitEnabled: false
        NSCameraUsageDescription: Сфотографировать документ для отправки в своё дело.
        NSPhotoLibraryUsageDescription: Выбрать фотографию документа для своего дела.
    entitlements:
      path: ModernSecure.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.modernsecure.modernSecure
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
          PROVISIONING_PROFILE_SPECIFIER: $(APP_STORE_PROFILE_UUID)
schemes:
  ModernSecure:
    build:
      targets:
        ModernSecure: all
    run:
      config: Debug
    archive:
      config: Release
